<!DOCTYPE html>
<html lang="ja">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>てらいけダッシュボード</title>
<!-- iPhoneのホーム画面に追加したとき、アプリのように全画面で開く（icon.png はこのファイルと同じ場所に置く） -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="てらいけ">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f5f3ee" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#15171a" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" type="image/png" href="icon.png">
<style>
  :root {
    --bg: #f5f3ee;
    --card: #ffffff;
    --text: #1f2328;
    --muted: #6b7078;
    --line: #e6e2d9;
    --field: #faf9f6;
    --accent: #2f7d5b;
    --accent-soft: #e3f1ea;
    --over: #c2410c;
    --over-soft: #fdebe1;
    --soon: #9a6700;
    --soon-soft: #fff4d1;
    --sat: #2563eb;
    --sun: #dc2626;
    --today: #fff8e1;
    --toast: #2b2f33;
    --shadow: 0 1px 2px rgba(0, 0, 0, .04), 0 2px 10px rgba(0, 0, 0, .04);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #15171a;
      --card: #1e2125;
      --text: #e8e9eb;
      --muted: #9aa0a8;
      --line: #2e3238;
      --field: #181a1d;
      --accent: #5cc497;
      --accent-soft: #1b3a2c;
      --over: #f4a07a;
      --over-soft: #3b2219;
      --soon: #e8c15a;
      --soon-soft: #3a3115;
      --sat: #8fb0ff;
      --sun: #ff8a8a;
      --today: #332e1c;
      --toast: #3a3f45;
      --shadow: none;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic UI", "Meiryo", sans-serif;
    font-size: 15px; line-height: 1.5; -webkit-text-size-adjust: 100%;
    padding-bottom: calc(66px + env(safe-area-inset-bottom));
  }
  button { font: inherit; color: inherit; cursor: pointer; }
  /* スマホで素早く2回押したときに、ダブルタップの拡大とみなされて押した分が消えないように */
  button, a, input, select, textarea, label { touch-action: manipulation; }
  [hidden] { display: none !important; }

  /* ヘッダー */
  .top {
    position: sticky; top: 0; z-index: 5;
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    padding: 10px 16px; background: var(--bg); border-bottom: 1px solid var(--line);
  }
  .top h1 { font-size: 17px; margin: 0; line-height: 1.3; }
  .top .date { font-size: 13px; color: var(--muted); }
  .top-actions { display: flex; gap: 6px; align-items: center; }
  .who-btn {
    border: 1px solid var(--line); background: var(--card); border-radius: 999px;
    padding: 6px 12px; font-size: 14px; min-height: 36px;
  }
  .icon-btn {
    width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--line);
    background: var(--card); font-size: 17px; line-height: 1; display: grid; place-items: center;
  }
  .icon-btn.spin span { display: inline-block; animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .preview {
    background: var(--soon-soft); color: var(--soon); font-size: 13px;
    padding: 6px 16px; text-align: center;
  }

  main { max-width: 1200px; margin: 0 auto; padding: 12px 16px 24px; }
  .pane { display: none; }
  .pane.active { display: block; }
  .contents { display: contents; }

  /* 部活の予定（画像・PDF） */
  .club-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; margin-bottom: 10px; }
  .club-meta .file { font-size: 12px; color: var(--muted); flex: 1 1 auto; min-width: 0; overflow-wrap: anywhere; }
  .club-meta a { font-size: 13px; color: var(--accent); white-space: nowrap; }
  .club-body img { display: block; width: 100%; height: auto; border-radius: 8px; border: 1px solid var(--line); background: #fff; }
  .club-body canvas { display: block; width: 100%; height: auto; margin-bottom: 10px; border-radius: 6px; border: 1px solid var(--line); background: #fff; }
  .club-body .empty { padding: 28px 0; }

  /* トピック欄（チェックリストの形。四角いチェック） */
  .check.sq span { border-radius: 7px; }
  .topic-card .name a { color: var(--accent); }
  .tag.gray { background: var(--field); color: var(--muted); border: 1px solid var(--line); }

  /* メモ欄（自由な文章。改行・空白も書いたとおりに表示） */
  .note-text { white-space: pre-wrap; overflow-wrap: anywhere; line-height: 1.7; font-size: 15px; }
  .note-foot { margin-top: 10px; }
  .note-input { min-height: 12em; }

  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: 14px;
    box-shadow: var(--shadow); padding: 14px 16px; margin-bottom: 12px;
  }
  .card-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
  .card-head h2 { font-size: 16px; margin: 0; }
  .muted { color: var(--muted); font-size: 12px; }
  .warn { color: var(--over); font-size: 13px; margin: 4px 0 8px; }
  .empty { color: var(--muted); text-align: center; padding: 18px 0 8px; }

  /* 予定 */
  .legend-row { display: flex; flex-wrap: wrap; gap: 4px 12px; margin-bottom: 4px; }
  .legend { font-size: 12px; color: var(--muted); display: inline-flex; align-items: center; gap: 5px; }
  .legend i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
  .cal-upd { align-self: center; }
  /* リンク集（予定の画面から開く）とメモ（.md を整形して表示） */
  .link-list { margin-bottom: 4px; }
  .lrow {
    width: 100%; display: flex; align-items: center; gap: 10px; text-align: left; color: inherit; text-decoration: none;
    border: 0; border-top: 1px solid var(--line); background: none; padding: 10px 2px; min-height: 52px;
  }
  .link-list li:first-child .lrow { border-top: 0; }
  .lrow .ico { font-size: 20px; flex: none; width: 26px; text-align: center; }
  .lrow .txt { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .lrow .nm { overflow-wrap: anywhere; }
  .lrow .sub { font-size: 12px; color: var(--muted); overflow-wrap: anywhere; }
  .lrow .go { color: var(--muted); flex: none; }
  .md-body { line-height: 1.75; font-size: 15px; overflow-wrap: anywhere; }
  .md-body h1, .md-body h2, .md-body h3, .md-body h4 { line-height: 1.4; margin: 1.1em 0 .4em; }
  .md-body h1 { font-size: 20px; } .md-body h2 { font-size: 18px; } .md-body h3 { font-size: 16px; } .md-body h4 { font-size: 15px; }
  .md-body > :first-child { margin-top: 0; }
  .md-body p { margin: .5em 0; }
  .md-body ul, .md-body ol { padding-left: 1.4em; margin: .4em 0; }
  .md-body li:has(> input[type="checkbox"]) { list-style: none; margin-left: -1.2em; }
  .md-body input[type="checkbox"] { margin: 0 6px 0 0; vertical-align: -1px; }
  .md-body a { color: var(--accent); }
  .md-body img { max-width: 100%; height: auto; border-radius: 6px; }
  .md-body hr { border: 0; border-top: 1px solid var(--line); margin: 1em 0; }
  .md-body code { background: var(--field); border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; font-size: 13px; }
  .md-body pre { background: var(--field); border: 1px solid var(--line); border-radius: 8px; padding: 10px; overflow-x: auto; }
  .md-body pre code { border: 0; padding: 0; }
  .md-body table { border-collapse: collapse; display: block; overflow-x: auto; margin: .6em 0; }
  .md-body th, .md-body td { border: 1px solid var(--line); padding: 4px 8px; text-align: left; }
  .md-body th { background: var(--field); }
  .md-body blockquote { margin: .6em 0; padding: 4px 12px; border-left: 3px solid var(--line); color: var(--muted); }
  .md-body blockquote.callout { border-left-color: var(--accent); background: var(--accent-soft); color: var(--text); border-radius: 0 8px 8px 0; }
  .md-body .callout-title { font-weight: 600; margin: 4px 0; color: var(--accent); }
  .md-body mark { background: var(--soon-soft); color: inherit; padding: 0 2px; }
  .md-body .embed { color: var(--muted); font-size: 13px; }
  /* 予定の絞り込み（カレンダーごと。色の印つき） */
  .cal-chips { margin-bottom: 8px; }
  .cal-chips .chip i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; margin-right: 6px; vertical-align: -1px; }
  .cal-chips .chip[aria-pressed="true"] i { box-shadow: 0 0 0 1.5px #fff; }
  .cal-list .day {
    display: grid; grid-template-columns: 74px 1fr; gap: 10px;
    padding: 9px 0; border-top: 1px solid var(--line);
  }
  .cal-list .day:first-child { border-top: 0; }
  .day-head { font-weight: 600; font-size: 14px; font-variant-numeric: tabular-nums; }
  .day-head .tag {
    display: inline-block; font-size: 11px; font-weight: 600; padding: 0 6px; border-radius: 6px;
    background: var(--accent-soft); color: var(--accent); margin-top: 2px;
  }
  .day-head .hol { display: block; font-size: 11px; font-weight: 400; color: var(--sun); }
  .sat .dw { color: var(--sat); }
  .sun .dw, .hd .dw { color: var(--sun); }
  .day.today { background: var(--today); margin: 0 -16px; padding-left: 16px; padding-right: 16px; }
  .day-events { min-width: 0; }
  .ev {
    display: flex; gap: 8px; align-items: stretch; padding: 3px 0;
    color: inherit; text-decoration: none; border-radius: 6px;
  }
  a.ev:active { background: var(--accent-soft); }
  .ev .bar { width: 4px; border-radius: 2px; background: var(--c); flex: none; }
  .ev .time { color: var(--muted); font-size: 13px; min-width: 40px; font-variant-numeric: tabular-nums; padding-top: 1px; }
  .ev .title { flex: 1; min-width: 0; overflow-wrap: anywhere; }
  .ev .go { color: var(--muted); font-size: 13px; padding-left: 4px; }
  .no-ev { color: var(--muted); font-size: 13px; padding: 3px 0; }

  .cal-grid { display: none; }
  .grid-head, .grid-body { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); }
  .grid-head div { font-size: 12px; color: var(--muted); text-align: center; padding: 4px 0; }
  .grid-head .sat { color: var(--sat); }
  .grid-head .sun { color: var(--sun); }
  .grid-body { border-top: 1px solid var(--line); border-left: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .cell { min-height: 112px; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); padding: 5px 6px; font-size: 12.5px; min-width: 0; }
  .cell.past { opacity: .45; }
  .cell.today { background: var(--today); }
  .cell .num { font-weight: 600; font-variant-numeric: tabular-nums; }
  .cell.sat .num { color: var(--sat); }
  .cell.sun .num, .cell.hd .num { color: var(--sun); }
  .cell .hol { font-size: 11px; color: var(--sun); margin-left: 4px; }
  .cell .today-tag { font-size: 11px; color: var(--accent); font-weight: 600; margin-left: 4px; }
  .gev {
    display: block; margin-top: 3px; padding: 1px 5px; border-radius: 4px;
    border-left: 3px solid var(--c); color: inherit; text-decoration: none;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .gev.allday { background: color-mix(in srgb, var(--c) 20%, transparent); }
  a.gev:hover { background: var(--accent-soft); }
  .gev .t { color: var(--muted); font-variant-numeric: tabular-nums; margin-right: 3px; }

  /* 入力欄 */
  input[type="text"], input[type="date"], select {
    font-size: 16px; padding: 9px 12px; border: 1px solid var(--line); border-radius: 10px;
    background: var(--field); color: var(--text); min-width: 0; min-height: 44px;
  }
  input:focus, select:focus { outline: 2px solid var(--accent); outline-offset: 0; border-color: transparent; }
  .add-row { display: flex; gap: 8px; }
  .add-row input { flex: 1; }
  .btn {
    min-height: 44px; padding: 0 18px; border-radius: 10px; border: 0;
    background: var(--accent); color: #fff; font-weight: 600; font-size: 15px; white-space: nowrap;
  }
  .btn:disabled { opacity: .5; }
  .field-label { font-size: 12px; color: var(--muted); margin: 10px 0 4px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip {
    font-size: 13px; padding: 5px 12px; border-radius: 999px; min-height: 32px;
    border: 1px solid var(--line); background: var(--card);
  }
  .chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
  .task-form { display: grid; gap: 8px; }
  .task-form .row2 { display: flex; gap: 8px; }
  .task-form .row2 > * { flex: 1; }

  /* リスト */
  .list { list-style: none; margin: 0; padding: 0; }
  .group-title { font-size: 12px; font-weight: 600; color: var(--muted); margin: 14px 0 0; }
  .item {
    display: flex; align-items: center; gap: 6px; padding: 6px 0;
    border-top: 1px solid var(--line); transition: opacity .3s;
  }
  .group-title + .list .item:first-child, .list .item:first-child { border-top: 0; }
  .item.tmp { opacity: .55; }
  .item.done { opacity: .45; }
  .item.done .name { text-decoration: line-through; }
  .check {
    width: 44px; height: 44px; margin-left: -8px; border: 0; background: none;
    display: grid; place-items: center; flex: none;
  }
  .check span {
    width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--muted);
    display: grid; place-items: center; color: #fff; font-size: 15px; font-weight: 700;
  }
  .item.done .check span { background: var(--accent); border-color: var(--accent); }
  .item.done .check span::after { content: "✓"; }
  .item .body { flex: 1; min-width: 0; }
  .item .name { overflow-wrap: anywhere; }
  .item .meta { font-size: 12px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: center; }
  .pill { font-size: 12px; padding: 0 8px; border-radius: 999px; background: var(--field); border: 1px solid var(--line); }
  .pill.over { background: var(--over-soft); color: var(--over); border-color: transparent; font-weight: 600; }
  .pill.soon { background: var(--soon-soft); color: var(--soon); border-color: transparent; font-weight: 600; }
  .del {
    width: 40px; height: 40px; border: 0; background: none; color: var(--muted);
    font-size: 18px; flex: none; border-radius: 50%;
  }
  .del:hover { background: var(--field); }
  /* チェックリスト */
  .ck-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
  .ck-card {
    text-align: left; border: 1px solid var(--line); background: var(--field); border-radius: 12px;
    padding: 12px; min-height: 76px; display: flex; flex-direction: column; justify-content: space-between; gap: 6px;
  }
  .ck-card .nm { font-weight: 600; overflow-wrap: anywhere; }
  .ck-card .st { font-size: 12px; color: var(--muted); }
  .ck-card .st.on { color: var(--soon); font-weight: 600; }
  .ck-card .st.ok { color: var(--accent); font-weight: 600; }
  .ck-card.new { border-style: dashed; color: var(--accent); font-weight: 600; justify-content: center; align-items: center; background: none; }
  .ck-back { margin: -6px 0 0 -4px; min-height: 34px; }
  .ck-title { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; margin-bottom: 8px; }
  .ck-title h3 { margin: 0; font-size: 17px; flex: 1 1 auto; min-width: 0; overflow-wrap: anywhere; }
  .ck-title .cnt { font-size: 13px; font-weight: 400; color: var(--muted); margin-left: 6px; white-space: nowrap; }
  .head-actions { display: flex; gap: 6px; margin-left: auto; flex: 0 0 auto; }
  .mini.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  .banner.lock { background: var(--over-soft); color: var(--over); font-weight: 600; }
  .ck-card .st.lock { color: var(--over); font-weight: 600; }
  .pc-only { display: none; }
  @media (min-width: 900px) { .pc-only { display: inline-block; } }
  .ok-btn { width: 100%; margin-top: 12px; }
  .sub-head { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .sub-head h3 { margin: 0; font-size: 16px; flex: 1; min-width: 0; overflow-wrap: anywhere; }
  .back { border: 0; background: none; color: var(--accent); font-weight: 600; padding: 6px 4px; min-height: 40px; white-space: nowrap; }
  .status-line { font-size: 13px; color: var(--muted); margin-bottom: 6px; }
  .banner { border-radius: 10px; padding: 10px 12px; font-size: 14px; margin-bottom: 8px; }
  .banner.ok { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  .banner.old { background: var(--soon-soft); color: var(--soon); }
  .crow {
    width: 100%; display: flex; align-items: center; gap: 12px; text-align: left;
    border: 0; border-top: 1px solid var(--line); background: none; padding: 10px 2px; min-height: 56px;
  }
  .list .crow-li:first-child .crow { border-top: 0; }
  .crow .box {
    width: 28px; height: 28px; border-radius: 8px; border: 2px solid var(--muted); flex: none;
    display: grid; place-items: center; color: #fff; font-weight: 700;
  }
  .crow.on .box { background: var(--accent); border-color: var(--accent); }
  .crow.on .box::after { content: "✓"; }
  .crow .txt { flex: 1; min-width: 0; font-size: 16px; overflow-wrap: anywhere; }
  .crow .by { font-size: 12px; color: var(--muted); white-space: nowrap; }
  .crow:disabled { cursor: default; }
  .row-btns { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  .btn-sub {
    min-height: 44px; padding: 0 16px; border-radius: 10px; border: 1px solid var(--line);
    background: var(--card); font-size: 14px; font-weight: 600;
  }
  .link-danger { border: 0; background: none; color: var(--over); font-size: 13px; padding: 12px 0 0; }
  textarea {
    width: 100%; font: inherit; font-size: 16px; line-height: 1.6; padding: 10px 12px;
    border: 1px solid var(--line); border-radius: 10px; background: var(--field); color: var(--text); resize: vertical;
  }
  textarea:focus { outline: 2px solid var(--accent); border-color: transparent; }
  #ckName { width: 100%; }
  .hist-day { font-size: 13px; font-weight: 600; margin: 14px 0 4px; }
  details.run { border-top: 1px solid var(--line); padding: 8px 0; }
  details.run summary { cursor: pointer; display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; list-style: none; }
  details.run summary::-webkit-details-marker { display: none; }
  details.run summary::before { content: "▸"; color: var(--muted); }
  details.run[open] summary::before { content: "▾"; }
  details.run .t { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 13px; }
  details.run .nm { font-weight: 600; }
  .run-st { font-size: 12px; padding: 0 8px; border-radius: 999px; }
  .run-st.done { background: var(--accent-soft); color: var(--accent); }
  .run-st.stop { background: var(--field); color: var(--muted); border: 1px solid var(--line); }
  .run-st.on { background: var(--soon-soft); color: var(--soon); }
  .run-items { list-style: none; margin: 6px 0 0; padding: 0 0 0 18px; font-size: 14px; }
  .run-items li { display: flex; gap: 8px; padding: 2px 0; }
  .run-items .mk { width: 1.2em; flex: none; }
  .run-items .no { color: var(--muted); }
  .run-items .who { margin-left: auto; color: var(--muted); font-size: 12px; white-space: nowrap; font-variant-numeric: tabular-nums; }

  /* 買い物：分類・表示切り替え・買ったもの */
  .field-label .hint { font-weight: 400; margin-left: 6px; }
  .chip.edit { border-style: dashed; color: var(--muted); }
  .store-editor { margin-top: 10px; padding: 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--field); }
  .store-editor .field-label { margin-top: 0; }
  .seg { display: flex; gap: 4px; margin: 14px 0 4px; padding: 3px; background: var(--field); border: 1px solid var(--line); border-radius: 10px; }
  .seg button { flex: 1; min-height: 36px; border: 0; border-radius: 8px; background: none; font-size: 14px; color: var(--muted); }
  .seg button[aria-selected="true"] { background: var(--card); color: var(--text); font-weight: 600; box-shadow: 0 1px 2px rgba(0, 0, 0, .08); }
  .tag { font-size: 11px; padding: 0 7px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); white-space: nowrap; }
  .mini {
    min-height: 34px; padding: 0 10px; border-radius: 8px; border: 1px solid var(--line);
    background: var(--card); font-size: 13px; white-space: nowrap; flex: none;
  }
  .mini.undo { color: var(--over); }
  .item.bought { gap: 8px; padding: 8px 0; }

  /* 下のタブ（スマホ） */
  .tabbar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; display: flex;
    background: var(--card); border-top: 1px solid var(--line);

    background: var(--toast); color: #fff; border-radius: 12px; padding: 10px 14px;

  #toast button { background: none; border: 0; color: #8fe0b8; font-weight: 700; padding: 4px 2px; white-space: nowrap; }

<script type="application/json" id="boot"><?!= boot ?></script>
<script>
(function () {
  'use strict';

  var $ = function (s, el) { return (el || document).querySelector(s); };
  var DOW = ['日', '月', '火', '水', '木', '金', '土'];
  var DAY = 864e5;

  var mem = {
    get: function (k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set: function (k, v) { try { localStorage.setItem(k, v); } catch (e) { /* 保存できない環境 */ } },
  };

  // 開き方は3通り：
  //  1) Apps Script の画面（BOOT が入っている）
  //  2) GitHub Pages の画面（URLの # の後ろに api・key・who・list。一度開けばこの端末に覚える）
  //  3) それ以外（PCで直接開いたとき）はサンプルデータのプレビュー
  var BOOT = null;
  try { BOOT = JSON.parse($('#boot').textContent); } catch (e) { /* Apps Script の外 */ }
  var GAS = !!(BOOT && window.google && google.script && google.script.run);
  var CFG = GAS ? null : (readHashCfg() || savedCfg());
  var API = CFG ? 'https://script.google.com/macros/s/' + CFG.api + '/exec' : '';
  var KEY = GAS ? BOOT.key : CFG ? CFG.key : '';
  var PKEY = GAS ? (BOOT.pkey || '') : CFG ? (CFG.pkey || '') : ''; // 親の合言葉（親のURLにだけ付く）
  var LIVE = GAS || !!API;
  var PREVIEW = !LIVE && !/^https?:$/.test(location.protocol);

  function readHashCfg() {
    var p = new URLSearchParams(location.hash.replace(/^#/, ''));
    var c = { api: p.get('api') || '', key: p.get('key') || '', pkey: p.get('pkey') || '', who: p.get('who') || '', list: p.get('list') || '' };
    if (!/^[\w-]{20,}$/.test(c.api) || !c.key) return null;
    mem.set('cfg', JSON.stringify({ api: c.api, key: c.key, pkey: c.pkey }));
    if (c.who) mem.set('who', c.who);
    return c;
  }
  function savedCfg() {
    try {
      var c = JSON.parse(mem.get('cfg') || 'null');
      return c && c.api && c.key ? { api: c.api, key: c.key, pkey: c.pkey || '', who: '', list: '' } : null;
    } catch (e) { return null; }
  }
  // ロックのボタンを出すか（本当に使えるかは、押したときにダッシュボードが親の合言葉で確かめる）
  function isParent() { return LIVE ? !!PKEY : (who === '父' || who === '母'); }

  var who = (BOOT && BOOT.who) || mem.get('who') || '';
  var data = null;
  var pending = 0;
  var mutSeq = 0;      // 書き込みを始めた回数（読み込みの返事が、書き込みより前の古いものかを見分ける）
  var serverBuf = null; // 書き込みの返事を、続けて押した分が全部終わるまでためておく
  var needReload = false;
  var queue = Promise.resolve();
  var shopFilter = mem.get('shopFilter'); // '*'＝すべて、''＝指定なし、それ以外＝お店の分類
  if (shopFilter === null) shopFilter = '*';
  var calFilter = mem.get('calFilter') || ''; // 予定の絞り込み（カレンダーの表示名）。''＝すべて
  var shopView = 'open';                  // open＝買う物、bought＝買ったもの
  var taskView = 'open';                  // open＝やること、done＝済んだもの
  var assigneeTouched = false;
  var tmpSeq = 0;

  // ---------- 日付（"2026-10-15" の文字列で扱う） ----------
  function parse(s) { var p = s.split('-').map(Number); return new Date(Date.UTC(p[0], p[1] - 1, p[2])); }
  function iso(d) { return d.toISOString().slice(0, 10); }
  function addDays(s, n) { return iso(new Date(parse(s).getTime() + n * DAY)); }
  function dow(s) { return parse(s).getUTCDay(); }
  function md(s) { var d = parse(s); return (d.getUTCMonth() + 1) + '/' + d.getUTCDate(); }
  function diffDays(a, b) { return Math.round((parse(b) - parse(a)) / DAY); }
  function localToday() { var n = new Date(); return iso(new Date(Date.UTC(n.getFullYear(), n.getMonth(), n.getDate()))); }

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function norm(s) { return String(s).normalize('NFKC').replace(/\s+/g, '').toLowerCase(); }
  function splitItems(text) {
    return String(text || '').split(/[、,，\n]+/).map(function (x) { return x.replace(/\s+/g, ' ').trim(); }).filter(Boolean);
  }
  function errMsg(e) {
    var m = (e && e.message) ? e.message : String(e || '');
    m = m.replace(/^(Exception|Error):\s*/, '');
    return m || '通信に失敗しました。もう一度お試しください。';
  }

  // ---------- サーバーとのやりとり ----------
  function call(fn) {
    var args = Array.prototype.slice.call(arguments, 1);
    if (GAS) {
      return new Promise(function (resolve, reject) {
        var r = google.script.run.withSuccessHandler(resolve).withFailureHandler(reject);
        r[fn].apply(r, [KEY].concat(args));
      });
    }
    if (API) {
      // text/plain で送ると、ブラウザの事前確認（CORS）なしで Apps Script に届く
      return fetch(API, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ fn: fn, key: KEY, args: args }),
      }).catch(function () {
        var err = new Error('通信できませんでした。電波を確かめてください。');
        err.net = true; // 通信そのものの失敗（やり直せば届くことがある）
        throw err;
      }).then(function (r) {
        if (!r.ok) {
          var err = new Error('通信に失敗しました（' + r.status + '）。');
          err.net = r.status >= 500 || r.status === 429;
          throw err;
        }
        return r.text();
      }).then(function (text) {
        var res;
        try { res = JSON.parse(text); } catch (e) {
          throw new Error('Apps Script から返事がありません。デプロイを新しいバージョンにしたか確認してください。');
        }
        if (!res.ok) throw new Error(res.error || 'エラーが起きました。');
        return res.data;
      });
    }
    return Mock[fn].apply(null, args);
  }

  function load(force) {
    if (pending) return;
    var seq = mutSeq;
    $('#refreshBtn').classList.add('spin');
    return call('getData', !!force).then(function (d) {
      // 読み込み中に操作（書き込み）があったら、この返事は操作の前の古い中身なので使わない（操作の返事を優先）
      if (pending || (data && seq !== mutSeq)) return;
      data = d;
      clockOffset = ts(d.now) - Date.now();
      if (startList) { // URLの list=… で指定されたチェックリストを開く
        var L = (d.checklists || []).filter(function (x) { return norm(x.name) === norm(startList); })[0];
        startList = '';
        if (L) { checkView = { mode: 'list', id: L.id }; setTab('check'); }
      }
      render();
      if (!who) openWho();
    }).catch(function (e) {
      toast(errMsg(e));
    }).then(function () {
      $('#refreshBtn').classList.remove('spin');
    });
  }

  // 書き込みは順番に送る（「済」→「元に戻す」の順序が入れ替わらないように）。
  // サーバーの返事は、続けて押した分がすべて終わってから画面に当てる。途中の返事をすぐ当てると、
  // まだ送っていない分のチェックが画面から消え、それを見てもう一度押すと「外す」が送られてしまうため（2026-10-19 スマホで多発）
  function mutate(fn, args, optimistic) {
    ckFlushAll(); // ためているチェックを先に順番待ちに入れる（「完了」→「元に戻す」の順番が入れ替わらないように）
    pending++;
    mutSeq++;
    if (optimistic) { optimistic(); render(); }
    queue = queue.then(function () {
      return call.apply(null, [fn].concat(args));
    }).then(function (lists) {
      serverBuf = Object.assign(serverBuf || {}, lists); // 後の返事ほど新しい（サーバーは順番に処理する）
    }).catch(function (e) {
      toast(errMsg(e));
      needReload = true;
    }).then(function () {
      pending--;
      settle();
    });
    return queue;
  }

  // 書き込みが全部終わったら、ためておいたサーバーの返事を画面に当てる（失敗があったときは読み込み直す）
  function settle() {
    if (pending) return;
    var buf = serverBuf;
    serverBuf = null;
    if (needReload) {
      needReload = false;
      // 画面を離れるときに送った分（下の ckBeacon）があれば、サーバーが書き終わるのを少し待ってから読み込む
      if (beaconAt && Date.now() - beaconAt < 5000) setTimeout(function () { load(); }, 2000); else load();
    } else {
      if (buf) Object.assign(data, buf);
      render();
    }
  }

  function requireWho() {
    if (who) return true;
    openWho();
    return false;
  }

  // ---------- 買い物 ----------
  function addShop(text, store) {
    if (!requireWho()) return;
    var names = splitItems(text);
    if (!names.length) return;
    var have = data.shopping.map(function (x) { return norm(x.name); });
    var added = names.filter(function (n) {
      if (have.indexOf(norm(n)) !== -1) return false;
      have.push(norm(n));
      return true;
    });
    if (!added.length) { toast('「' + names.join('、') + '」はもうリストにあります'); return; }
    mutate('addShopping', [added.join('、'), store || '', who], function () {
      added.forEach(function (n) {
        data.shopping.push({ id: 'tmp' + (++tmpSeq), name: n, store: store || '', by: who, at: data.today, tmp: true });
      });
    });
  }

  function finishShop(id, status, label) {
    if (!requireWho()) return;
    var it = find(data.shopping, id);
    if (!it || it.tmp) return;
    markDone(id, status === '済');
    setTimeout(function () {
      mutate('setShoppingStatus', [id, status, who], function () {
        data.shopping = data.shopping.filter(function (x) { return x.id !== id; });
        if (status === '済') {
          data.bought = data.bought || [];
          data.bought.unshift({ id: it.id, name: it.name, store: it.store, by: it.by, at: it.at, doneBy: who, doneAt: nowStr() });
        }
      });
    }, status === '済' ? 350 : 0);
    toast('「' + it.name + '」を' + label, '元に戻す', function () {
      mutate('setShoppingStatus', [id, '未', who], function () {
        data.bought = (data.bought || []).filter(function (x) { return x.id !== id; });
        if (!find(data.shopping, id)) data.shopping.push(it);
      });
    });
  }

  // 買ったもの → 買う物リストに戻す（間違えて済にしたとき）
  function restoreShop(id) {
    if (!requireWho()) return;
    var it = find(data.bought || [], id);
    if (!it) return;
    mutate('setShoppingStatus', [id, '未', who], function () {
      data.bought = data.bought.filter(function (x) { return x.id !== id; });
      if (!find(data.shopping, id)) data.shopping.push({ id: it.id, name: it.name, store: it.store, by: it.by, at: it.at || data.today });
    });
    toast('「' + it.name + '」を買う物リストに戻しました');
  }

  function openStoreEditor() {
    if (!requireWho()) return;
    $('#storeText').value = (data.stores || []).join('\n');
    $('#storeEditor').hidden = false;
    $('#storeText').focus();
  }

  function saveStoresUI() {
    var list = uniq($('#storeText').value.split(/[\n、,，]/).map(function (x) {
      return x.replace(/\s+/g, ' ').trim().slice(0, 20);
    })).filter(function (x) { return x !== 'すべて' && x !== '指定なし'; });
    if (list.length > 20) { toast('お店の分類は20個までです'); return; }
    $('#storeEditor').hidden = true;
    mutate('saveStores', [list.join('\n')], function () { data.stores = list; });
  }

  // ---------- タスク ----------
  function addTaskItem(text, assignee, due) {
    if (!requireWho()) return;
    text = String(text || '').replace(/\s+/g, ' ').trim();
    if (!text) return;
    mutate('addTask', [text, assignee, due, who], function () {
      data.tasks.push({ id: 'tmp' + (++tmpSeq), text: text, assignee: assignee, due: due, by: who, at: data.today, tmp: true });
    });
  }

  function finishTask(id, status, label) {
    if (!requireWho()) return;
    var it = find(data.tasks, id);
    if (!it || it.tmp) return;
    markDone(id, status === '済');
    setTimeout(function () {
      mutate('setTaskStatus', [id, status, who], function () {
        data.tasks = data.tasks.filter(function (x) { return x.id !== id; });
        if (status === '済') {
          data.doneTasks = data.doneTasks || [];
          data.doneTasks.unshift(Object.assign({}, it, { doneBy: who, doneAt: nowStr() }));
        }
      });
    }, status === '済' ? 350 : 0);
    toast('「' + it.text + '」を' + label, '元に戻す', function () {
      mutate('setTaskStatus', [id, '未', who], function () {
        data.doneTasks = (data.doneTasks || []).filter(function (x) { return x.id !== id; });
        if (!find(data.tasks, id)) data.tasks.push(it);
      });
    });
  }

  // 済んだもの → やることに戻す（間違えて済にしたとき）
  function restoreTask(id) {
    if (!requireWho()) return;
    var it = find(data.doneTasks || [], id);
    if (!it) return;
    mutate('setTaskStatus', [id, '未', who], function () {
      data.doneTasks = data.doneTasks.filter(function (x) { return x.id !== id; });
      if (!find(data.tasks, id)) {
        data.tasks.push({ id: it.id, text: it.text, assignee: it.assignee, due: it.due, by: it.by, at: it.at || data.today });
      }
    });
    toast('「' + it.text + '」をやることに戻しました');
  }

  function find(list, id) { for (var i = 0; i < list.length; i++) if (list[i].id === id) return list[i]; return null; }
  function markDone(id, done) {
    var el = document.querySelector('[data-id="' + id.replace(/"/g, '') + '"]');
    if (el) el.classList.add(done ? 'done' : 'tmp');
  }

  // ---------- 表示 ----------
  function render() {
    if (!data) return;
    var t = data.today;
    $('#todayLabel').textContent = parse(t).getUTCMonth() + 1 + '月' + parse(t).getUTCDate() + '日（' + DOW[dow(t)] + '）';

    renderCal();

  function calColor(c, i) { return (c.calendars[i] && c.calendars[i].color) || '#888888'; }
  function safeLink(u) { return /^https:\/\//.test(u || '') ? u : ''; }

  function renderCal() {
    var c = data.calendar || { calendars: [], events: [], holidays: {}, errors: [] };
    // 絞り込み：選んだカレンダー（表示名）の予定だけ。''＝すべて。見つからない名前なら、すべてに戻す
    var only = -1;
    c.calendars.forEach(function (x, i) { if (calFilter && x.name === calFilter) only = i; });
    if (only === -1) calFilter = '';
    var byDay = {};
    c.events.forEach(function (ev) {
      if (only !== -1 && ev.cal !== only) return;
      var d = ev.date;
      for (var guard = 0; d <= ev.endDate && guard < 40; guard++) {
        (byDay[d] = byDay[d] || []).push(ev);
        if (!ev.allDay) break;
        d = addDays(d, 1);
      }
    });
    Object.keys(byDay).forEach(function (d) {
      byDay[d].sort(function (a, b) {
        return (b.allDay - a.allDay) || String(a.start || '').localeCompare(String(b.start || '')) || a.cal - b.cal;
      });
    });

    $('#calLegend').innerHTML = c.calendars.length < 2 ? '' : [{ name: '', label: 'すべて' }].concat(c.calendars).map(function (x) {
      return '<button type="button" class="chip" data-act="cal-filter" data-cal="' + esc(x.name) + '" aria-pressed="' + (x.name === calFilter) + '">' +
        (x.color ? '<i style="background:' + esc(x.color) + '"></i>' : '') + esc(x.label || x.name) + '</button>';
    }).join('');
    $('#calUpdated').textContent = c.updated ? c.updated + ' 時点' : '';
    var err = $('#calError');
    err.hidden = !(c.errors && c.errors.length);
    err.textContent = err.hidden ? '' : '読み込めなかったカレンダー：' + c.errors.join('、');

    var today = data.today;

    // スマホ：今日から○日分の一覧
    var html = '';
    for (var i = 0; i < data.phoneDays; i++) {
      var d = addDays(today, i);
      var hol = c.holidays[d];
      var cls = 'day' + (i === 0 ? ' today' : '') + (dow(d) === 6 ? ' sat' : '') + (dow(d) === 0 ? ' sun' : '') + (hol ? ' hd' : '');
      var tag = i === 0 ? '<span class="tag">今日</span>' : i === 1 ? '<span class="tag">明日</span>' : '';
      var evs = byDay[d] || [];
      html += '<div class="' + cls + '"><div class="day-head">' + md(d) + '<span class="dw">(' + DOW[dow(d)] + ')</span>' +
        (tag ? '<br>' + tag : '') + (hol ? '<span class="hol">' + esc(hol) + '</span>' : '') + '</div>' +
        '<div class="day-events">' + (evs.length ? evs.map(function (ev) { return evRow(ev, c); }).join('') : '<div class="no-ev">予定なし</div>') + '</div></div>';
    }
    $('#calList').innerHTML = html;

    // PC：今週の月曜から週ごとの表
    var start = addDays(today, -((dow(today) + 6) % 7));
    var weeks = Math.max(1, data.pcWeeks);
    while (diffDays(today, addDays(start, weeks * 7)) < data.phoneDays && weeks < 10) weeks++;
    var head = ['月', '火', '水', '木', '金', '土', '日'].map(function (w, k) {
      return '<div class="' + (k === 5 ? 'sat' : k === 6 ? 'sun' : '') + '">' + w + '</div>';
    }).join('');
    var cells = '';
    for (var j = 0; j < weeks * 7; j++) {
      var dd = addDays(start, j);
      var h = c.holidays[dd];
      var n = diffDays(today, dd);
      var cc = 'cell' + (n < 0 ? ' past' : '') + (n === 0 ? ' today' : '') + (dow(dd) === 6 ? ' sat' : '') + (dow(dd) === 0 ? ' sun' : '') + (h ? ' hd' : '');
      var num = (j === 0 || parse(dd).getUTCDate() === 1) ? md(dd) : String(parse(dd).getUTCDate());
      var list = byDay[dd] || [];
      cells += '<div class="' + cc + '"><span class="num">' + num + '</span>' +
        (n === 0 ? '<span class="today-tag">今日</span>' : '') +
        (h ? '<span class="hol">' + esc(h) + '</span>' : '') +
        list.map(function (ev) { return gridEv(ev, c); }).join('') + '</div>';
    }
    $('#calGrid').innerHTML = '<div class="grid-head">' + head + '</div><div class="grid-body">' + cells + '</div>';
  }

  function evRow(ev, c) {
    var link = safeLink(ev.link);
    var inner = '<span class="bar"></span><span class="time">' + (ev.allDay ? '終日' : esc(ev.start)) + '</span>' +
      '<span class="title">' + esc(ev.title) + '</span>' + (link ? '<span class="go">›</span>' : '');

      : '<div class="ev"' + style + '>' + inner + '</div>';

  function gridEv(ev, c) {
    var link = safeLink(ev.link);
    var inner = (ev.allDay ? '' : '<span class="t">' + esc(ev.start) + '</span>') + esc(ev.title);
    var attrs = ' class="gev' + (ev.allDay ? ' allday' : '') + '" style="--c:' + esc(calColor(c, ev.cal)) + '" title="' +
      esc((ev.allDay ? '終日 ' : ev.start + '〜' + ev.end + ' ') + ev.title) + '"';
    return link
      ? '<a' + attrs + ' href="' + esc(link) + '" target="_blank" rel="noopener">' + inner + '</a>'
      : '<div' + attrs + '>' + inner + '</div>';
  }

  function renderShop() {
    var stores = data.stores || [];
    if (shopFilter !== '*' && shopFilter !== '' && stores.indexOf(shopFilter) === -1) shopFilter = '*';
    function match(it) { return shopFilter === '*' || (it.store || '') === shopFilter; }
    function rank(s) { if (!s) return -1; var i = stores.indexOf(s); return i === -1 ? 999 : i; }

    $('#storeChips').innerHTML = [['*', 'すべて'], ['', '指定なし']].concat(stores.map(function (s) { return [s, s]; }))
      .map(function (c) {
        return '<button type="button" class="chip" data-act="store" data-store="' + esc(c[0]) + '" aria-pressed="' +
          (c[0] === shopFilter) + '">' + esc(c[1]) + '</button>';
      }).join('') +
      '<button type="button" class="chip edit" data-act="store-edit" aria-label="お店の分類を編集">✎ 編集</button>';

    var all = data.shopping;
    var items = all.filter(match).sort(function (a, b) { return a.at.localeCompare(b.at); });
    $('#segOpen').setAttribute('aria-selected', String(shopView === 'open'));
    $('#segBought').setAttribute('aria-selected', String(shopView === 'bought'));
    $('#segOpen').textContent = '買う物（' + items.length + '）';
    $('#shopCount').textContent = all.length ? '全' + all.length + '件' : '';

    var html = '';
    if (shopView === 'open') {
      if (!items.length) {
        html = '<div class="empty">' + (shopFilter === '*' ? '買う物はありません' : 'この分類で買う物はありません') + '</div>';
      } else if (shopFilter === '*') {
        // 「すべて」のときは、お店ごとに見出しを付けて並べる
        var groups = {};
        items.forEach(function (it) { (groups[it.store] = groups[it.store] || []).push(it); });
        var keys = Object.keys(groups).sort(function (a, b) { return rank(a) - rank(b) || a.localeCompare(b, 'ja'); });
        var grouped = keys.some(function (k) { return k !== ''; });
        keys.forEach(function (k) {
          if (grouped) html += '<div class="group-title">' + (k ? esc(k) : '指定なし') + '</div>';
          html += '<ul class="list">' + groups[k].map(shopItem).join('') + '</ul>';
        });
      } else {
        html = '<ul class="list">' + items.map(shopItem).join('') + '</ul>';
      }
    } else {
      var list = (data.bought || []).filter(match);
      if (!list.length) {
        html = '<div class="empty">この30日に買ったものはありません</div>';
      } else {
        var lastDay = '';
        list.forEach(function (it) {
          var d = it.doneAt.slice(0, 10);
          if (d !== lastDay) {
            html += (lastDay ? '</ul>' : '') + '<div class="group-title">' + esc(dayLabel(d)) + '</div><ul class="list">';
            lastDay = d;
          }
          html += boughtItem(it);
        });
        html += '</ul><div class="muted" style="margin-top:10px">間違えて済にしたものは「戻す」で買う物リストに戻ります。「もう一度」は同じ物を新しく追加します。</div>';
      }
    }
    $('#shopList').innerHTML = html;

    var b = $('#shopBadge');
    b.hidden = !all.length;
    b.textContent = all.length;
  }

  function boughtItem(it) {
    var meta = (it.doneBy ? it.doneBy + ' · ' : '') + hm(it.doneAt) + ' に購入' + (it.by && it.by !== it.doneBy ? ' · 追加：' + it.by : '');
    return '<li class="item bought" data-id="' + esc(it.id) + '"><div class="body"><div class="name">' + esc(it.name) +
      (it.store && shopFilter === '*' ? ' <span class="tag">' + esc(it.store) + '</span>' : '') + '</div>' +
      '<div class="meta">' + esc(meta) + '</div></div>' +
      '<button type="button" class="mini" data-act="readd" data-name="' + esc(it.name) + '" data-store="' + esc(it.store) + '">もう一度</button>' +
      '<button type="button" class="mini undo" data-act="bought-undo">戻す</button></li>';
  }

  function shopItem(it) {
    var meta = [it.by, it.at ? md(it.at) : ''].filter(Boolean).join(' · ');
    return '<li class="item' + (it.tmp ? ' tmp' : '') + '" data-id="' + esc(it.id) + '">' +
      '<button type="button" class="check" data-act="shop-done" aria-label="' + esc(it.name) + 'を買った"><span></span></button>' +
      '<div class="body"><div class="name">' + esc(it.name) + '</div>' +
      (meta ? '<div class="meta">' + esc(meta) + '</div>' : '') + '</div>' +
      '<button type="button" class="del" data-act="shop-del" aria-label="' + esc(it.name) + 'を削除">×</button></li>';
  }

  function dueInfo(due) {
    var n = diffDays(data.today, due);
    var base = md(due) + '(' + DOW[dow(due)] + ')';
    if (n < 0) return { cls: 'over', text: base + ' · ' + (-n) + '日すぎ' };
    if (n === 0) return { cls: 'over', text: '今日まで' };
    if (n === 1) return { cls: 'soon', text: '明日まで' };
    return { cls: n <= 3 ? 'soon' : '', text: base + ' · あと' + n + '日' };
  }

  function renderTask() {
    var tasks = data.tasks.slice().sort(function (a, b) {
      if (a.due && b.due) return a.due.localeCompare(b.due) || a.at.localeCompare(b.at);
      if (a.due) return -1;
      if (b.due) return 1;
      return a.at.localeCompare(b.at);
    });
    $('#segTaskOpen').setAttribute('aria-selected', String(taskView === 'open'));
    $('#segTaskDone').setAttribute('aria-selected', String(taskView === 'done'));
    $('#segTaskOpen').textContent = '未完了（' + tasks.length + '）';
    $('#taskCount').textContent = tasks.length ? tasks.length + '件' : '';

    var html = '';
    if (taskView === 'open') {
      html = tasks.length
        ? '<ul class="list">' + tasks.map(taskItem).join('') + '</ul>'
        : '<div class="empty">タスクはありません</div>';
    } else {
      var done = data.doneTasks || [];
      if (!done.length) {
        html = '<div class="empty">この30日に済ませたタスクはありません</div>';
      } else {
        var lastDay = '';
        done.forEach(function (it) {
          var d = it.doneAt.slice(0, 10);
          if (d !== lastDay) {
            html += (lastDay ? '</ul>' : '') + '<div class="group-title">' + esc(dayLabel(d)) + '</div><ul class="list">';
            lastDay = d;
          }
          html += doneTaskItem(it);
        });
        html += '</ul><div class="muted" style="margin-top:10px">間違えて済にしたものは「戻す」で、やることに戻ります。</div>';
      }
    }
    $('#taskList').innerHTML = html;

    var sel = $('#taskAssignee');
    var cur = assigneeTouched ? sel.value : (data.members.indexOf(who) !== -1 ? who : '');
    sel.innerHTML = '<option value="">担当：なし</option>' + data.members.map(function (m) {
      return '<option value="' + esc(m) + '">担当：' + esc(m) + '</option>';
    }).join('');
    sel.value = cur;

    var over = tasks.filter(function (x) { return x.due && diffDays(data.today, x.due) <= 0; }).length;
    var b = $('#taskBadge');
    b.hidden = !tasks.length;
    b.textContent = tasks.length;
    b.classList.toggle('alert', over > 0);
  }

  function taskItem(it) {
    var meta = '';
    if (it.due) { var d = dueInfo(it.due); meta += '<span class="pill ' + d.cls + '">' + esc(d.text) + '</span>'; }
    meta += '<span>' + (it.assignee ? '担当：' + esc(it.assignee) : '担当なし') + '</span>';
    if (it.by) meta += '<span>' + esc(it.by) + ' · ' + esc(it.at ? md(it.at) : '') + '</span>';
    return '<li class="item' + (it.tmp ? ' tmp' : '') + '" data-id="' + esc(it.id) + '">' +
      '<button type="button" class="check" data-act="task-done" aria-label="' + esc(it.text) + 'を完了"><span></span></button>' +
      '<div class="body"><div class="name">' + esc(it.text) + '</div><div class="meta">' + meta + '</div></div>' +
      '<button type="button" class="del" data-act="task-del" aria-label="' + esc(it.text) + 'を削除">×</button></li>';
  }

  function doneTaskItem(it) {
    var meta = '<span>' + esc((it.doneBy ? it.doneBy + ' · ' : '') + hm(it.doneAt) + ' に完了') + '</span>';
    if (it.due) meta += '<span>期限 ' + esc(md(it.due) + '(' + DOW[dow(it.due)] + ')') + '</span>';
    meta += '<span>' + (it.assignee ? '担当：' + esc(it.assignee) : '担当なし') + '</span>';
    return '<li class="item bought" data-id="' + esc(it.id) + '"><div class="body"><div class="name">' + esc(it.text) + '</div>' +
      '<div class="meta">' + meta + '</div></div>' +
      '<button type="button" class="mini undo" data-act="task-undo">戻す</button></li>';
  }

  // ---------- チェックリスト ----------
  var checkView = { mode: 'index', id: '' }; // index / list / edit / history
  var dismissed = {};       // 「新しく始める」で閉じた完了表示（リストごと）
  var history = null;
  var historyFilter = '';
  var historyDirty = true;
  var clockOffset = 0;
  var startList = (BOOT && BOOT.list) || (CFG && CFG.list) || '';

  function pad(n) { return ('0' + n).slice(-2); }
  function ts(s) {
    var m = String(s || '').match(/(\d+)-(\d+)-(\d+) (\d+):(\d+)(?::(\d+))?/);
    return m ? Date.UTC(+m[1], m[2] - 1, +m[3], +m[4], +m[5], +(m[6] || 0)) : 0;
  }
  // サーバー（日本時間）の「今」を "2026-10-15 08:05" の形で
  function nowStr() {
    var d = new Date(Date.now() + clockOffset);
    return iso(d) + ' ' + pad(d.getUTCHours()) + ':' + pad(d.getUTCMinutes());
  }
  function hm(s) { return String(s || '').slice(11, 16); }
  function dayLabel(d) {
    return d === data.today ? '今日' : d === addDays(data.today, -1) ? '昨日' : md(d) + '(' + DOW[dow(d)] + ')';
  }
  function whenLabel(s) { return s ? dayLabel(s.slice(0, 10)) + ' ' + hm(s) : ''; }
  function shortWhen(s, baseDay) { return s.slice(0, 10) === baseDay ? hm(s) : md(s.slice(0, 10)) + ' ' + hm(s); }
  function countChecked(items, checks) { return items.filter(function (x) { return checks[x]; }).length; }
  function uniq(a) { return a.filter(function (x, i) { return x && a.indexOf(x) === i; }); }
  function findList(id) { return find(data.checklists || [], id); }

  function viewOf(L) {
    if (L.active) return { mode: 'active', run: L.active, items: L.active.items, checks: L.active.checks };
    var last = L.last;
    var d = dismissed[L.id];
    // 閉じたのと同じ回だけを閉じたままにする（2026-10-29から、画面とサーバーで回のIDが同じになったので、時刻のずれは見ない）
    var closed = !!(d && last && last.id === d.id);
    if (last && last.status === '完了' && !closed && ts(nowStr()) - ts(last.endedAt) < 30 * 60000) {
      return { mode: 'done', run: last, items: last.items, checks: last.checks };
    }
    return { mode: 'fresh', run: null, items: L.items, checks: {} };
  }

  function renderCheck() {
    var box = $('#checkCard');
    var lists = data.checklists || [];
    var activeCount = lists.filter(function (L) { return L.active; }).length;
    var b = $('#checkBadge');
    b.hidden = !activeCount;
    b.textContent = activeCount;

    if (checkView.mode === 'edit') {
      if (!$('#ckEditor')) box.innerHTML = editorHtml();
      return;
    }
    if (checkView.mode === 'history') {
      if (!$('#ckHistory') || historyDirty) { box.innerHTML = historyHtml(); historyDirty = false; }
      return;
    }
    if (checkView.mode === 'list') {
      var L = findList(checkView.id);
      if (L) { box.innerHTML = listHtml(L); return; }
      checkView = { mode: 'index', id: '' };
    }
    box.innerHTML = indexHtml(lists);
  }

  // 「完了」＝全部チェック、「これでOK」＝途中で「今回はこれでOK」を押した、「途中まで」＝中断
  function runLabel(r) {
    if (r.status !== '完了') return r.status === '実施中' ? 'チェック中' : '途中まで';
    return countChecked(r.items, r.checks) < r.items.length ? 'これでOK' : '完了';
  }

  // このリストがアプリのロックに使われていれば、その様子（data.lock）を返す
  function lockOf(L) {
    var k = data.lock;
    return k && k.listName && norm(k.listName) === norm(L.name) ? k : null;
  }
  function lockText(k) {
    var why = k.reason === '帰宅' ? '帰宅' : k.reason === '外出' ? '外出' : k.reason === '手動' ? (k.by || '親') + 'の手動ロック' : '平日の昼のロック';
    if (k.locked) return '🔒 ロック中（' + k.since + 'の' + why + 'から）';
    if (k.unlockBy) return '🔓 ' + k.doneAt + 'に' + k.unlockBy + 'がロックを解除。アプリが使えます';
    return k.doneAt ? '🔓 ' + k.doneAt + 'に完了。アプリが使えます' : '🔓 ロックなし';
  }

  // 親だけ：今すぐロック／ロックを解く（直後に「元に戻す」）
  function setLock(on, undoable) {
    if (!requireWho()) return;
    var prev = data.lock ? Object.assign({}, data.lock) : null;
    mutate(on ? 'manualLock' : 'manualUnlock', [PKEY, who], function () {
      if (!data.lock) return;
      var t = nowStr().slice(11, 16);
      if (on) Object.assign(data.lock, { locked: true, since: t, reason: '手動', by: who, doneAt: '', unlockBy: '' });
      else Object.assign(data.lock, { locked: false, doneAt: t, unlockBy: who });
    });
    if (undoable !== false) {
      toast(on ? '今すぐロックしました' : 'ロックを解きました', '元に戻す', function () {
        setLock(!on, false);
        if (prev && data.lock) Object.assign(data.lock, prev);
      });
    }
  }

  function lastLabel(last) {
    return '前回 ' + whenLabel(last.endedAt) + ' ' + runLabel(last) + (last.endedBy ? '（' + last.endedBy + '）' : '');
  }

  function indexHtml(lists) {
    var cards = lists.map(function (L) {
      var v = viewOf(L);
      var st = 'まだ記録なし', cls = '';
      if (v.mode === 'active') { st = 'チェック中 ' + countChecked(v.items, v.checks) + '/' + v.items.length; cls = 'on'; }
      else if (v.mode === 'done') { st = '✓ ' + runLabel(v.run) + ' ' + hm(v.run.endedAt) + ' ' + v.run.endedBy; cls = 'ok'; }
      else if (L.last) { st = lastLabel(L.last); }
      var k = lockOf(L);
      if (k && k.locked) { st = '🔒 ロック中 ' + (v.mode === 'active' ? countChecked(v.items, v.checks) + '/' + v.items.length : ''); cls = 'lock'; }
      return '<button type="button" class="ck-card" data-act="ck-open" data-list="' + esc(L.id) + '">' +

  // ---------- チェックの書き込み（まとめて送る・失敗したらやり直す・画面を離れるときは残りを送る） ----------
  // 2026-10-29：1つずつ順番に送っていたころ、スマホでは1回に1〜3秒かかり、「今回はこれでOK」が届く前に画面を離れると
  // 残りが届かず、ロックが解けないまま途中までのチェックに戻ることがあった。そこで、
  //  ・押した分は少しためて、1回の通信にまとめて送る（サーバーの syncChecklist）
  //  ・通信が切れたら、少し待ってやり直す（帰宅直後はWi-Fiが不安定）
  //  ・「今回はこれでOK」は、画面に出ているチェックを全部付けて送る（前の分が届いていなくても、これ1回で正しくなる）
  //  ・画面を離れるとき、まだ送っていない分は、ブラウザに頼んで送ってもらう（sendBeacon）
  //  ・送り終わるまで「保存中…」を出す
  var ckOut = {};   // リストID → { runId, changes: {項目: true/false}, finish, timer, queued, held }
  var beaconAt = 0; // 画面を離れるときに送った時刻
  function newRunId() { return 'c' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
  function wait(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
  function ckSaving(listId) { return !!ckOut[listId]; }

  // 送る分を足して、少し待ってから送る（続けて押した分を1回にまとめる）
  function ckSend(listId, delay) {
    var s = ckOut[listId] || (ckOut[listId] = { runId: '', changes: {}, finish: false, timer: null, queued: false, held: false });
    if (!s.held) { s.held = true; pending++; } // 送り終わるまで、読み込みの返事で画面を戻さない
    mutSeq++;
    clearTimeout(s.timer);
    s.timer = setTimeout(function () { ckFlush(listId); }, delay);
    return s;
  }

  function ckFlushAll() {
    Object.keys(ckOut).forEach(function (id) { if (ckOut[id].timer) ckFlush(id); });
  }

  // 順番待ちの列（queue）に入れる。自分の番が来たときに、そこまでにたまった分をまとめて送る
  function ckFlush(listId) {
    var s = ckOut[listId];
    if (!s) return;
    clearTimeout(s.timer);
    s.timer = null;
    if (s.queued) return;
    s.queued = true;
    queue = queue.then(function () {
      s.queued = false;
      var changes = s.changes, finish = s.finish;
      if (!Object.keys(changes).length && !finish) return;
      s.changes = {};
      s.finish = false;
      return ckPost(listId, s.runId, changes, finish, 0).then(function (lists) {
        serverBuf = Object.assign(serverBuf || {}, lists);
      }).catch(function (e) {
        toast(errMsg(e) + '（チェックを保存できませんでした）');
        needReload = true;
      });
    }).then(function () {
      if (s.timer || s.queued || Object.keys(s.changes).length || s.finish) return; // まだ送る分がある
      if (ckOut[listId] === s) delete ckOut[listId];
      if (s.held) { s.held = false; pending--; }
      if (checkView.id === listId) renderCheck();
      settle();
    });
  }

  // 通信そのものが失敗したときは、少しずつ間をあけて5回までやり直す
  function ckPost(listId, runId, changes, finish, tries) {
    return call('syncChecklist', listId, runId, changes, finish, who).catch(function (e) {
      if (!e.net || tries >= 5) throw e;
      return wait(Math.min(2000 * (tries + 1), 8000)).then(function () {
        return ckPost(listId, runId, changes, finish, tries + 1);
      });
    });
  }

  // 画面を離れるとき（ホームに戻る・ほかのアプリを開く）：まだ送っていない分を、ブラウザに送ってもらう
  function ckBeacon() {
    if (!API || !navigator.sendBeacon) return;
    Object.keys(ckOut).forEach(function (listId) {
      var s = ckOut[listId];
      if (!Object.keys(s.changes).length && !s.finish) return;
      var body = JSON.stringify({ fn: 'syncChecklist', key: KEY, args: [listId, s.runId, s.changes, s.finish, who] });
      if (navigator.sendBeacon(API, new Blob([body], { type: 'text/plain;charset=utf-8' }))) {
        s.changes = {};
        s.finish = false;
        beaconAt = Date.now();
        needReload = true; // 戻ってきたら、サーバーの最新を読み込む
      }
    });
  }
  document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'hidden') ckBeacon(); });
  window.addEventListener('pagehide', ckBeacon);

  function toggleCheck(item) {
    if (!requireWho()) return;
    var L = findList(checkView.id);
    if (!L) return;
    var v = viewOf(L);
    if (v.mode === 'done') return;
    var checked = !v.checks[item];
    var at = nowStr();
    if (!L.active) {
      L.active = { id: newRunId(), listId: L.id, listName: L.name, status: '実施中', startedBy: who, startedAt: at,
        endedBy: '', endedAt: '', items: L.items.slice(), checks: {} };
    }
    var r = L.active;
    if (checked) r.checks[item] = { by: who, at: at }; else delete r.checks[item];
    var s = ckSend(L.id, 400);
    s.runId = r.id;
    s.changes[item] = checked;
    if (r.items.every(function (x) { return r.checks[x]; })) {
      L.last = Object.assign({}, r, { status: '完了', endedBy: who, endedAt: at });
      L.active = null;
      ckFlush(L.id); // 全部チェックしたら、待たずに送る
      toast('「' + L.name + '」完了！おつかれさまです', '元に戻す', function () { reopenList(L.id, item); });
    } else if (!Object.keys(r.checks).length) {
      L.active = null;
    }
    history = null;
    render();
  }

  // 完了後の「新しく始める」：完了の表示を閉じて、空のリストにする（記録はそのまま残る）
  function restartList() {
    var L = findList(checkView.id);
    if (!L) return;
    var v = viewOf(L);
    if (v.mode !== 'done') return;
    dismissed[L.id] = { id: v.run.id };
    renderCheck();
  }

  // 今回はこれでOK：全部チェックしていなくても、この回を完了にする
  function finishList() {
    if (!requireWho()) return;
    var L = findList(checkView.id);
    if (!L || !L.active) return;
    var run = L.active;
    var at = nowStr();
    // 画面に出ているチェックを全部付けて送る（前に送った分が届いていなくても、これ1回で正しくなる）。待たずに送る
    var s = ckSend(L.id, 0);
    s.runId = run.id;
    run.items.forEach(function (x) { if (run.checks[x]) s.changes[x] = true; });
    s.finish = true;
    ckFlush(L.id);
    L.last = Object.assign({}, run, { status: '完了', endedBy: who, endedAt: at });
    L.active = null;
    history = null;
    render();
    toast('「' + L.name + '」を、今回はこれでOKにしました', '元に戻す', function () { reopenList(L.id, ''); });
  }

  // 完了にした回をチェック中に戻す。item があれば、その項目のチェックも外す
  function reopenList(listId, item) {
    if (!requireWho()) return;
    var L = findList(listId);
    if (!L || !L.last) return;
    var last = L.last;
    mutate('reopenChecklist', [listId, item || '', who], function () {
      var checks = Object.assign({}, last.checks);
      if (item) delete checks[item];
      L.active = Object.keys(checks).length
        ? Object.assign({}, last, { status: '実施中', endedBy: '', endedAt: '', checks: checks })
        : null;
      L.last = null;
      delete dismissed[listId];
      history = null;
    });
  }

  function saveList() {
    if (!requireWho()) return;
    var name = $('#ckName').value.replace(/\s+/g, ' ').trim();
    var items = uniq($('#ckItems').value.split('\n').map(function (x) { return x.replace(/\s+/g, ' ').trim(); }));
    if (!name) { toast('リストの名前を入力してください'); return; }
    if (!items.length) { toast('項目を1つ以上入力してください'); return; }
    var id = checkView.id;
    var dup = (data.checklists || []).some(function (x) { return x.id !== id && norm(x.name) === norm(name); });
    if (dup) { toast('同じ名前のリストがあります'); return; }
    var L = id ? findList(id) : null;
    checkView = L ? { mode: 'list', id: id } : { mode: 'index', id: '' };
    mutate('saveChecklist', [L ? id : '', name, items.join('\n'), who], function () {
      if (L) {
        L.name = name;
        L.items = items.slice();
        if (L.active) L.active.items = items.slice();
      } else {
        data.checklists.push({ id: 'tmp' + (++tmpSeq), name: name, items: items, active: null, last: null });
      }
    });
  }

  function deleteList() {
    var L = findList(checkView.id);
    if (!L || !requireWho()) return;
    checkView = { mode: 'index', id: '' };
    mutate('setChecklistStatus', [L.id, '削除', who], function () {
      data.checklists = data.checklists.filter(function (x) { return x.id !== L.id; });
    });
    toast('「' + L.name + '」を削除しました', '元に戻す', function () {
      mutate('setChecklistStatus', [L.id, '有効', who], function () {
        if (!findList(L.id)) data.checklists.push(L);
      });
    });
  }

  function openHistory(listId) {
    checkView = { mode: 'history', id: '' };
