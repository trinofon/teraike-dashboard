  // ---------- 部活の予定（ドライブにある最新の予定表を表示する） ----------
  var PDFJS = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';
  var clubKey = '';
  var clubFiles = {}; // タブID → { info, loading, error, rendered, cacheTried, checkedAt }
  var CLUB_RECHECK = 60 * 60000; // 開いたままのときは、1時間たったらドライブに新しいファイルがないか確かめ直す

  // 部活の予定表は、この端末（ブラウザの保存場所 IndexedDB）に取っておく。
  // 開いたときはまず取っておいたものを出し、ドライブに新しいファイルがあるときだけ中身を取り直す（読み込みを速くするため）
  var clubStore = (function () {
    var dbp = null;
    function open() {
      if (!dbp) {
        dbp = new Promise(function (resolve, reject) {
          if (!window.indexedDB) { reject(new Error('保存できない環境')); return; }
          var req = indexedDB.open('teraike', 1);
          req.onupgradeneeded = function () { req.result.createObjectStore('club'); };
          req.onsuccess = function () { resolve(req.result); };
          req.onerror = function () { reject(req.error); };
        });
      }
      return dbp;
    }
    function run(mode, fn) {
      return open().then(function (db) {
        return new Promise(function (resolve, reject) {
          var t = db.transaction('club', mode);
          var r = fn(t.objectStore('club'));
          t.oncomplete = function () { resolve(r ? r.result : undefined); };
          t.onerror = t.onabort = function () { reject(t.error); };
        });
      });
    }
    return {
      get: function (id) { try { return run('readonly', function (s) { return s.get(id); }).catch(function () { return null; }); } catch (e) { return Promise.resolve(null); } },
      put: function (id, v) { try { return run('readwrite', function (s) { s.put(v, id); }).catch(function () {}); } catch (e) { return Promise.resolve(); } },
    };
  })();

  function isWide() { return window.matchMedia('(min-width: 900px)').matches; }

  // タブと中身の枠は、スプレッドシートの「部活の予定」シートの設定から作る（名前を公開ページに書かないため）。
  // 次に開いたときに読み込みを待たずに同じタブを出せるよう、タブの設定をこの端末に覚えておく
  var CLUB_FIELDS = ['id', 'label', 'icon', 'fileTitle', 'topicTitle', 'memoTitle'];
  function savedClubs() {
    try {
      var list = JSON.parse(mem.get('clubs') || '[]');
      return Array.isArray(list) ? list.filter(function (c) { return c && c.id; }) : [];
    } catch (e) { return []; }
  }

  function renderClubs(list) {
    var clubs = list || data.clubs || [];
    var key = clubs.map(function (c) { return CLUB_FIELDS.map(function (k) { return c[k]; }).join(':'); }).join('|');
    if (key === clubKey) return;
    clubKey = key;
    if (!list) {
      mem.set('clubs', JSON.stringify(clubs.map(function (c) {
        var o = {};
        CLUB_FIELDS.forEach(function (k) { o[k] = c[k] || ''; });
        return o;
      })));
    }
    Array.prototype.forEach.call(document.querySelectorAll('.tabbar .club-tab'), function (b) { b.remove(); });
    $('#tabCal').insertAdjacentHTML('afterend', clubs.map(function (c) {
      return '<button type="button" role="tab" class="club-tab" data-act="tab" data-tab="club-' + esc(c.id) + '">' +
        '<span class="ico">' + esc(c.icon || '📄') + '</span>' + esc(c.label) + '</button>';
    }).join(''));
    $('#clubPanes').innerHTML = clubs.map(function (c) {
      return '<section class="pane club-pane" data-pane="club-' + esc(c.id) + '" data-club="' + esc(c.id) + '" aria-label="' + esc(c.label) + '">' +
        // 予定表の欄（ドライブの最新の予定表）
        '<div class="card"><div class="card-head"><h2>' + esc(c.fileTitle || c.label) + '</h2><span class="head-actions">' +
        '<button type="button" class="mini" data-act="club-reload">最新を確認</button>' +
        '<button type="button" class="mini pc-only" data-act="club-wide">大きく</button></span></div>' +
        '<div class="club-meta"></div><div class="club-body"><div class="empty">読み込み中…</div></div></div>' +
        // トピック欄（チェックリストの形。編集・記録を見る）
        '<div class="card topic-card" data-topic="' + esc(c.id) + '"><div class="card-head"><h2>' + esc(c.topicTitle || c.label + 'トピック') + '</h2>' +
        '<span class="head-actions"><button type="button" class="mini" data-act="topic-edit">編集</button>' +
        '<button type="button" class="mini" data-act="topic-log">記録を見る</button></span></div>' +
        '<div class="topic-body"></div></div>' +
        // メモ欄（自由な文章。書いたとおりに表示。編集だけ）
        '<div class="card note-card" data-note="' + esc(c.id) + '"><div class="card-head"><h2>' + esc(c.memoTitle || c.label + 'メモ') + '</h2>' +
        '<span class="head-actions"><button type="button" class="mini" data-act="note-edit">編集</button></span></div>' +
        '<div class="note-body"></div></div></section>';
    }).join('');
    Object.keys(clubFiles).forEach(function (id) { clubFiles[id].rendered = false; });
    applyTab();
  }

  // ---------- トピック欄（子どものタブの中。チェックリストの形） ----------
  // 項目をチェックすると「済」になり、チェックした人と時刻が残る。「記録を見る」で見られ、「戻す」でリストに戻る。
  // 「編集」は1行に1項目。消した行も「削除」として記録に残り、「戻す」でリストに戻せる。
  var topicView = {}; // タブID → list（リスト）/ edit（編集）/ log（記録）

  function topicCard(id) { return document.querySelector('.topic-card[data-topic="' + String(id).replace(/"/g, '') + '"]'); }
  function clubById(id) { return (data.clubs || []).filter(function (c) { return c.id === id; })[0]; }
  function topicTitle(id) { var c = clubById(id); return c ? c.topicTitle : 'トピック'; }
  function topicOf(id) {
    data.topics = data.topics || {};
    return data.topics[id] || (data.topics[id] = { items: [], done: [] });
  }
  function linkify(text) {
    return esc(text).replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>');
  }

  function renderTopics() { (data.clubs || []).forEach(function (c) { renderTopic(c.id, false); }); }

  function renderTopic(id, force) {
    var card = topicCard(id);
    if (!card) return;
    var mode = topicView[id] || 'list';
    var body = $('.topic-body', card);
    $('.head-actions', card).hidden = mode === 'edit';
    if (mode === 'edit') { // 入力中は、自動の更新で書き換えない
      if (force || !$('textarea', body)) body.innerHTML = topicEditorHtml(id);
      return;
    }
    body.innerHTML = mode === 'log' ? topicLogHtml(id) : topicListHtml(id);
    $('[data-act="topic-log"]', card).textContent = mode === 'log' ? 'リストに戻る' : '記録を見る';
  }

  function topicListHtml(id) {
    var m = topicOf(id);
    if (!m.items.length) return '<div class="empty">リストは空です。「編集」から項目を足せます</div>';
    return '<ul class="list">' + m.items.map(function (it) {
      return '<li class="item' + (it.tmp ? ' tmp' : '') + '" data-id="' + esc(it.id) + '">' +
        '<button type="button" class="check sq" data-act="topic-check" aria-label="' + esc(it.text) + 'を済にする"><span></span></button>' +
        '<div class="body"><div class="name">' + linkify(it.text) + '</div></div></li>';
    }).join('') + '</ul>';
  }

  function topicEditorHtml(id) {
    return '<div class="field-label" style="margin-top:0">1行に1つ。並べ替えは行の順番で。消した行は「記録を見る」から戻せます。</div>' +
      '<textarea class="topic-text" rows="8" placeholder="例：&#10;演奏会の集合は8:30&#10;楽譜のコピーを持っていく">' +
      esc(topicOf(id).items.map(function (x) { return x.text; }).join('\n')) + '</textarea>' +
      '<div class="row-btns"><button type="button" class="btn" data-act="topic-save">保存</button>' +
      '<button type="button" class="btn-sub" data-act="topic-cancel">やめる</button></div>';
  }

  function topicLogHtml(id) {
    var done = topicOf(id).done;
    if (!done.length) return '<div class="empty">この30日に済にした・消した項目はありません</div>';
    var html = '';
    var lastDay = '';
    done.forEach(function (it) {
      var d = it.doneAt.slice(0, 10);
      if (d !== lastDay) {
        html += (lastDay ? '</ul>' : '') + '<div class="group-title">' + esc(dayLabel(d)) + '</div><ul class="list">';
        lastDay = d;
      }
      var removed = it.status === '削除';
      html += '<li class="item bought" data-id="' + esc(it.id) + '"><div class="body"><div class="name">' +
        (removed ? '<span class="tag gray">消した</span> ' : '<span class="tag">済</span> ') + linkify(it.text) + '</div>' +
        '<div class="meta">' + esc((it.doneBy ? it.doneBy + ' · ' : '') + hm(it.doneAt) + (removed ? ' に編集で削除' : ' にチェック')) + '</div></div>' +
        '<button type="button" class="mini undo" data-act="topic-restore">戻す</button></li>';
    });
    return html + '</ul><div class="muted" style="margin-top:10px">「戻す」で、リストに戻ります。</div>';
  }

  // チェック → 済（直後に「元に戻す」）
  function topicCheck(mid, itemId) {
    if (!requireWho()) return;
    var m = topicOf(mid);
    var it = find(m.items, itemId);
    if (!it || it.tmp) return;
    markDone(itemId, true);
    var at = nowStr();
    setTimeout(function () {
      mutate('setTopicItemStatus', [itemId, '済', who], function () {
        m.items = m.items.filter(function (x) { return x.id !== itemId; });
        m.done.unshift({ id: it.id, text: it.text, status: '済', doneBy: who, doneAt: at });
      });
    }, 350);
    toast('「' + it.text + '」を済にしました', '元に戻す', function () { topicRestore(mid, itemId, it.text); });
  }

  // 記録 → リストに戻す（済にしたもの・編集で消したもの）
  function topicRestore(mid, itemId, text) {
    if (!requireWho()) return;
    var m = topicOf(mid);
    var it = find(m.done, itemId) || { id: itemId, text: text || '' };
    mutate('setTopicItemStatus', [itemId, '未', who], function () {
      m.done = m.done.filter(function (x) { return x.id !== itemId; });
      if (!find(m.items, itemId)) m.items.push({ id: it.id, text: it.text });
    });
    toast('「' + it.text + '」をリストに戻しました');
  }

  // 編集の保存：行の順に並べ、新しい行は項目を足し、消えた行は「削除」として記録へ
  function saveTopicEdit(mid) {
    if (!requireWho()) return;
    var lines = $('textarea', topicCard(mid)).value.split('\n')
      .map(function (x) { return x.replace(/\s+/g, ' ').trim(); }).filter(Boolean);
    var m = topicOf(mid);
    topicView[mid] = 'list';
    mutate('saveTopicItems', [mid, lines.join('\n'), who], function () {
      var pool = m.items.slice();
      var next = lines.map(function (t) {
        var k = pool.findIndex(function (x) { return x.text === t; });
        return k !== -1 ? pool.splice(k, 1)[0] : { id: 'tmp' + (++tmpSeq), text: t, tmp: true };
      });
      pool.forEach(function (x) { m.done.unshift({ id: x.id, text: x.text, status: '削除', doneBy: who, doneAt: nowStr() }); });
      m.items = next;
      renderTopic(mid, true);
    });
    toast('「' + topicTitle(mid) + '」を保存しました');
  }

  // ---------- メモ欄（子どものタブの中。自由な文章を、書いたとおりに表示） ----------
  var noteEditing = {}; // タブID → 編集中なら true

  function noteCard(id) { return document.querySelector('.note-card[data-note="' + String(id).replace(/"/g, '') + '"]'); }
  // 子どものタブのメモ（IDはタブのID）と、「やること」のメモ（ID は task）
  function renderNotes() {
    (data.clubs || []).map(function (c) { return c.id; }).concat(['task']).forEach(function (id) { renderNote(id, false); });
  }
  function noteTitle(id) { var card = noteCard(id); return card ? $('h2', card).textContent : 'メモ'; }

  function renderNote(id, force) {
    var card = noteCard(id);
    if (!card) return;
    var body = $('.note-body', card);
    $('.head-actions', card).hidden = !!noteEditing[id];
    if (noteEditing[id]) { // 入力中は、自動の更新で書き換えない
      if (force || !$('textarea', body)) body.innerHTML = noteEditorHtml(id);
      return;
    }
    var n = (data.notes || {})[id];
    body.innerHTML = n && n.text
      ? '<div class="note-text">' + esc(n.text) + '</div>' +
        '<div class="muted note-foot">' + esc('最終更新：' + (n.by ? n.by + ' ' : '') + whenLabel(n.at)) + '</div>'
      : '<div class="empty">まだメモはありません。「編集」から書けます</div>';
  }

  function noteEditorHtml(id) {
    var n = (data.notes || {})[id];
    return '<textarea class="note-input" rows="10" placeholder="自由に書けます（改行や空白も、書いたとおりに表示されます）">' +
      esc(n ? n.text : '') + '</textarea>' +
      '<div class="row-btns"><button type="button" class="btn" data-act="note-save">保存</button>' +
      '<button type="button" class="btn-sub" data-act="note-cancel">やめる</button></div>';
  }

  // 保存（直後に「元に戻す」を出す。元に戻すも同じ関数で、前の文章を保存し直す）
  function saveNoteText(id, text, label) {
    if (!requireWho()) return;
    var title = noteTitle(id);
    var prev = ((data.notes || {})[id] || { text: '' }).text;
    var body = String(text).replace(/\r\n?/g, '\n').replace(/\s+$/, '');
    noteEditing[id] = false;
    mutate('saveNote', [id, body, who], function () {
      data.notes = data.notes || {};
      data.notes[id] = { text: body, by: who, at: nowStr() };
      renderNote(id, true);
    });
    toast('「' + title + '」を' + (label || '保存しました'), '元に戻す', function () {
      saveNoteText(id, prev, '元に戻しました');
    });
  }

  function loadClub(id, force) {
    var st = clubFiles[id] || (clubFiles[id] = { info: null, loading: false, error: '', rendered: false, cacheTried: false, checkedAt: 0 });
    if (st.loading) return;
    // 1) まず、この端末に取っておいた予定表を出す（あれば）
    if (!st.cacheTried) {
      st.cacheTried = true;
      st.loading = true;
      clubStore.get('club:' + id).then(function (saved) {
        st.loading = false;
        if (saved && saved.found && saved.data && !st.info) { st.info = saved; st.rendered = false; drawClub(id); }
        loadClub(id, force);
      });
      return;
    }
    // 2) ドライブに新しいファイルがないかを確かめる（開いて最初の1回・1時間ごと・「最新を確認」のとき）
    if (st.checkedAt && Date.now() - st.checkedAt < CLUB_RECHECK && !force) { if (!st.rendered) drawClub(id); return; }
    st.loading = true;
    if (st.info) drawClub(id); // 「確認中…」を出す
    var known = st.info || {};
    call('getClubFile', id, known.id || '', known.updated || '').then(function (res) {
      st.loading = false;
      st.checkedAt = Date.now();
      st.error = '';
      if (res.same && st.info) {
        if (force) toast('いま表示しているのが最新です');
      } else {
        st.info = res;
        st.rendered = false;
        if (res.found && res.data) clubStore.put('club:' + id, res); // 新しい予定表を取っておく
      }
      drawClub(id);
    }).catch(function (e) {
      st.loading = false;
      st.error = errMsg(e);
      drawClub(id);
    });
  }

  function drawClub(id) {
    var pane = document.querySelector('.club-pane[data-club="' + String(id).replace(/"/g, '') + '"]');
    var st = clubFiles[id];
    if (!pane || !st) return;
    var meta = $('.club-meta', pane);
    var body = $('.club-body', pane);
    var f = st.info;
    // 確かめられなかったとき：取っておいた予定表があればそれを出したまま、上に一言だけ出す
    if (st.error && !f) { meta.innerHTML = ''; body.innerHTML = '<div class="empty">' + esc(st.error) + '</div>'; return; }
    if (!f) return;
    if (!f.found) {
      meta.innerHTML = '';
      body.innerHTML = '<div class="empty">「' + esc(f.folder) + '」に「' + esc(f.pattern) + '」のファイルが見つかりません</div>';
      return;
    }
    var link = safeLink(f.url);
    var note = st.loading ? '新しい予定表がないか確認中…' : st.error ? '最新か確かめられませんでした（前に読み込んだものを表示）' : '';
    meta.innerHTML = '<span class="file">' + esc(f.name) + (f.updated ? '（' + esc(md(f.updated.slice(0, 10))) + ' 更新）' : '') +
      (note ? '<br><span class="muted">' + esc(note) + '</span>' : '') + '</span>' +
      (link ? '<a href="' + esc(link) + '" target="_blank" rel="noopener">ドライブで開く ›</a>' : '');
    if (st.rendered) return;
    st.rendered = true;
    if (/^image\//.test(f.mime)) {
      body.innerHTML = '<img alt="' + esc(f.name) + '" src="data:' + esc(f.mime) + ';base64,' + f.data + '">';
    } else if (f.mime === 'application/pdf') {
      body.innerHTML = '<div class="empty">PDFを表示しています…</div>';
      renderPdf(body, f.data).catch(function (e) {
        body.innerHTML = '<div class="empty">' + esc(errMsg(e)) + '</div>';
      });
    } else {
      body.innerHTML = '<div class="empty">この種類のファイル（' + esc(f.mime) + '）は、ここでは表示できません。「ドライブで開く」から見てください。</div>';
    }
  }

  // PDFは、PDF.js（Mozilla製の表示部品）で1ページずつ絵にして並べる（iPhoneでも全ページ見えるように）
  function loadPdfJs() {
    if (window.pdfjsLib) return Promise.resolve(window.pdfjsLib);
    return new Promise(function (resolve, reject) {
      var s = document.createElement('script');
      s.src = PDFJS + 'pdf.min.js';
      s.onload = function () {
        window.pdfjsLib.GlobalWorkerOptions.workerSrc = PDFJS + 'pdf.worker.min.js';
        resolve(window.pdfjsLib);
      };
      s.onerror = function () { reject(new Error('PDFを表示する部品を読み込めませんでした。通信を確かめてください。')); };
      document.head.appendChild(s);
    });
  }

  function renderPdf(container, base64) {
    return loadPdfJs().then(function (lib) {
      var raw = atob(base64);
      var bytes = new Uint8Array(raw.length);
      for (var i = 0; i < raw.length; i++) bytes[i] = raw.charCodeAt(i);
      return lib.getDocument({ data: bytes }).promise;
    }).then(function (pdf) {
      container.innerHTML = '';
      var width = Math.max(container.clientWidth, 320);
      var ratio = Math.min(window.devicePixelRatio || 1, 2) * 1.25; // 拡大しても読めるよう少し細かく
      var chain = Promise.resolve();
      for (var n = 1; n <= Math.min(pdf.numPages, 10); n++) {
        chain = chain.then(function (num) {
          return pdf.getPage(num).then(function (page) {
            var vp = page.getViewport({ scale: width / page.getViewport({ scale: 1 }).width * ratio });
            var canvas = document.createElement('canvas');
            canvas.width = Math.floor(vp.width);
            canvas.height = Math.floor(vp.height);
            container.appendChild(canvas);
            return page.render({ canvasContext: canvas.getContext('2d'), viewport: vp }).promise;
          });
        }.bind(null, n));
      }
      return chain;
    });
  }

  // ---------- リンク集（予定のカードの「🔗 リンク集」から開く） ----------
  // メモ（.md）はドライブの決めたフォルダから、Webページは「リンク集」シートから。中身は合言葉つきで Apps Script からもらう
  // （公開ページには置かない）。メモは marked で整形し、DOMPurify で危ない書き込みを取り除いてから出す。
  var MD_LIBS = [
    'https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js',
    'https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js',
  ];
  var LINKS_RECHECK = 5 * 60000; // 一覧は5分たったら取り直す
  var calMode = 'cal';           // cal＝予定 / links＝リンク集 / memo＝メモを1つ表示
  var linkState = { data: savedLinks(), at: 0, loading: false, error: '' };
  var memoState = { id: '', info: null, loading: false, error: '' };

  function savedLinks() {
    try { var d = JSON.parse(mem.get('links') || 'null'); return d && d.memos && d.webs ? d : null; } catch (e) { return null; }
  }

  function setCalMode(mode) {
    calMode = mode;
    $('#calCard').hidden = mode !== 'cal';
    $('#linksCard').hidden = mode === 'cal';
    window.scrollTo(0, 0);
  }

  function openLinks(force) {
    setCalMode('links');
    renderLinks();
    if (!force && linkState.data && Date.now() - linkState.at < LINKS_RECHECK) return;
    if (linkState.loading) return;
    linkState.loading = true;
    renderLinks();
    call('getLinks', PKEY, !!force).then(function (d) {
      linkState = { data: d, at: Date.now(), loading: false, error: '' };
      mem.set('links', JSON.stringify(d));
    }).catch(function (e) {
      linkState.loading = false;
      linkState.error = errMsg(e);
    }).then(function () { if (calMode === 'links') renderLinks(); });
  }

  function renderLinks() {
    var d = linkState.data;
    var html = '<div class="sub-head"><button type="button" class="back" data-act="links-close">‹ 予定</button><h3>🔗 リンク集</h3>' +
      '<button type="button" class="mini" data-act="links-reload">↻ 最新</button></div>';
    if (linkState.loading) html += '<div class="status-line">' + (d ? '最新か確認中…' : '読み込み中…') + '</div>';
    if (linkState.error) html += '<div class="warn">' + esc(linkState.error) + (d ? '（前に読み込んだ一覧を表示しています）' : '') + '</div>';
    if (d) {
      html += '<div class="group-title">メモ</div>' + (d.memos.length ? '<ul class="list link-list">' + d.memos.map(function (m) {
        return '<li><button type="button" class="lrow" data-act="memo-open" data-memo="' + esc(m.id) + '"><span class="ico">📝</span>' +
          '<span class="txt"><span class="nm">' + esc(m.title) + '</span><span class="sub">' + esc(md(m.updated.slice(0, 10))) + ' 更新' +
          (m.parentOnly ? '・親だけ' : '') + '</span></span><span class="go">›</span></button></li>';
      }).join('') + '</ul>' : '<div class="empty">リンク集のフォルダに .md ファイルを置くと、ここに並びます</div>');
      html += '<div class="group-title">リンク</div>' + (d.webs.length ? '<ul class="list link-list">' + d.webs.map(function (w) {
        var link = safeLink(w.url);
        return link ? '<li><a class="lrow" href="' + esc(link) + '" target="_blank" rel="noopener"><span class="ico">🔗</span>' +
          '<span class="txt"><span class="nm">' + esc(w.title) + '</span>' + (w.desc || w.parentOnly ? '<span class="sub">' + esc(w.desc) +
          (w.parentOnly ? (w.desc ? '・' : '') + '親だけ' : '') + '</span>' : '') + '</span><span class="go">↗</span></a></li>' : '';
      }).join('') + '</ul>' : '<div class="empty">スプレッドシートの「リンク集」シートに書くと、ここに並びます</div>');
    }
    $('#linksCard').innerHTML = html;
  }

  function memoOf(id) { return ((linkState.data && linkState.data.memos) || []).filter(function (m) { return m.id === id; })[0]; }

  // メモを1つ開く：この端末に取っておいたものを先に出し、更新があったときだけ中身を取り直す
  function openMemo(id) {
    if (!id) return;
    var head = memoOf(id) || { id: id, title: 'メモ' };
    memoState = { id: id, head: head, info: null, loading: true, error: '' };
    setCalMode('memo');
    renderMemo();
    clubStore.get('memo:' + id).then(function (saved) {
      if (memoState.id !== id) return;
      if (saved && typeof saved.text === 'string') { memoState.info = saved; renderMemo(); }
      var known = memoState.info || {};
      return call('getMemo', PKEY, id, known.updated || '').then(function (res) {
        if (memoState.id !== id) return;
        if (!(res.same && memoState.info)) {
          memoState.info = res;
          clubStore.put('memo:' + id, res);
        }
        memoState.loading = false;
        renderMemo();
      });
    }).catch(function (e) {
      if (memoState.id !== id) return;
      memoState.loading = false;
      memoState.error = errMsg(e);
      renderMemo();
    });
  }

  function renderMemo() {
    var st = memoState;
    var f = st.info || st.head;
    var note = st.loading ? (st.info ? '　更新を確認中…' : '') : '';
    var html = '<div class="sub-head"><button type="button" class="back" data-act="links-open">‹ リンク集</button><h3>' + esc(f.title || 'メモ') + '</h3></div>' +
      '<div class="status-line">' + (f.updated ? esc(md(f.updated.slice(0, 10)) + ' ' + hm(f.updated)) + ' 更新' : '') + esc(note) + '</div>';
    if (st.error) html += '<div class="warn">' + esc(st.error) + (st.info ? '（前に読み込んだものを表示しています）' : '') + '</div>';
    html += '<div class="md-body">' + (st.info ? '<div class="empty">表示を準備しています…</div>' : st.error ? '' : '<div class="empty">読み込み中…</div>') + '</div>';
    $('#linksCard').innerHTML = html;
    if (!st.info) return;
    var id = st.id, text = st.info.text;
    loadMdLibs().then(function () {
      if (memoState.id !== id || calMode !== 'memo') return;
      $('#linksCard .md-body').innerHTML = mdToHtml(text);
    }).catch(function (e) {
      if (memoState.id !== id) return;
      $('#linksCard .md-body').innerHTML = '<div class="warn">' + esc(errMsg(e)) + '</div>';
    });
  }

  function loadScript(src) {
    return new Promise(function (resolve, reject) {
      var s = document.createElement('script');
      s.src = src;
      s.onload = resolve;

        text: '---\ncreated: ' + T(-2) + '\ntags:\n  - 家族\n---\n# 家のきまり\n\n> [!note] 大事なこと\n> 夜は ==22時== までに帰る。\n\n' +
          '## 毎日すること\n- [x] 食器を下げる\n- [ ] 洗濯物を出す\n- 宿題\n  - 学校の分\n  - 塾の分\n\n' +
          '## ごみの日\n| 曜日 | 出すもの |\n|---|---|\n| 月・木 | 燃やすごみ |\n| 水 | プラスチック |\n\n' +
          '連絡先は [[02_よく使う連絡先（サンプル）|よく使う連絡先]] を見る。[[ないメモ]] は文字だけになる。\n\n' +
          '![[写真.jpg]]\n\n**太字** と *斜体* と `コード`、外のリンクは [サンプル](https://example.com/)。<img src="x" onerror="alert(1)">' }, // 最後は危ない書き込みの見本（取り除かれる）
      { id: 'md2', name: '02_よく使う連絡先（サンプル）.md', title: 'よく使う連絡先（サンプル）', updated: T(-5) + ' 08:30', parentOnly: false,
        text: '# よく使う連絡先\n\n1. 学校：000-0000-0000\n2. かかりつけ：000-0000-0001\n\n[[01_家のきまり（サンプル）]] に戻る' },
      { id: 'md3', name: '手続きのメモ（サンプル）.md', title: '手続きのメモ（サンプル）', updated: T(-1) + ' 19:40', parentOnly: true,
        text: '# 手続きのメモ\n\n親だけが見られるメモの見本です。\n\n> [!warning]\n> 期限に注意。' },
    ];
    function setStatus(list, id, st, w) {
      db[list].forEach(function (x) {
        if (x.id !== id) return;
        x.st = st;
        x.doneBy = st === '済' ? w : '';
        x.doneAt = st === '済' ? nowLocal() : '';
      });
      return later(lists());
    }
    return {
      getData: function () {
        return later(Object.assign({
          today: today, now: nowLocal() + ':' + pad(new Date().getSeconds()), members: ['父', '母', '兄', '妹'],
          stores: db.stores.slice(),
          phoneDays: 31, pcWeeks: 2, calendar: cal,
          clubs: [
            { id: 'k1', label: '妹', icon: '🎺', fileTitle: '妹部活スケジュール', topicTitle: '妹トピック', memoTitle: '妹メモ' },
            { id: 'k2', label: '兄', icon: '🏸', fileTitle: '兄部活スケジュール', topicTitle: '兄トピック', memoTitle: '兄メモ' },
          ],
          topics: topicsOut(),
          notes: JSON.parse(JSON.stringify(notes)),
          lock: mockLock(),
          checklists: JSON.parse(JSON.stringify(checklistsOut())),
        }, lists()));
      },
      checkItem: function (listId, item, checked, w) {
        var L = cls.filter(function (x) { return x.id === listId; })[0];
        var r = activeRun(listId);
        if (!r) {
          if (!checked) return cl();
          r = { id: 'r' + (seq++), listId: listId, listName: L.name, status: '実施中', startedBy: w, startedAt: nowLocal(), endedBy: '', endedAt: '', items: L.items.slice(), checks: {} };
          runs.push(r);
        }
        if (checked) r.checks[item] = { by: w, at: nowLocal() }; else delete r.checks[item];
        if (r.items.every(function (x) { return r.checks[x]; })) { r.status = '完了'; r.endedBy = w; r.endedAt = nowLocal(); }
        else if (!Object.keys(r.checks).length) { r.status = '中断'; r.endedBy = w; r.endedAt = nowLocal(); }
        return cl();
      },
      // サーバーの syncChecklist と同じ動き：まとめて書き込み、finish なら「これでOK」で完了。終わった回への知らせは無視
      syncChecklist: function (listId, runId, changes, finish, w) {
        if (window.__mockFail && window.__mockFail-- > 0) { // プレビューで「通信の失敗」を試すため
          var err = new Error('通信できませんでした。電波を確かめてください。');
          err.net = true;
          return new Promise(function (res, rej) { setTimeout(function () { rej(err); }, 150); });
        }
        var L = cls.filter(function (x) { return x.id === listId; })[0];
        var known = runs.filter(function (x) { return x.id === runId; })[0];
        if (known && known.status !== '実施中') return cl();
        var entries = Object.keys(changes).map(function (k) { return [k, changes[k] === true]; });
        var r = activeRun(listId);
        if (!r) {
          if (!entries.some(function (e) { return e[1]; })) return cl();
          r = { id: known || !runId ? 'r' + (seq++) : runId, listId: listId, listName: L.name, status: '実施中', startedBy: w, startedAt: nowLocal(), endedBy: '', endedAt: '', items: L.items.slice(), checks: {} };
          runs.push(r);
        }
        entries.forEach(function (e) {
          if (r.items.indexOf(e[0]) === -1) return;
          if (e[1]) { if (!r.checks[e[0]]) r.checks[e[0]] = { by: w, at: nowLocal() }; } else delete r.checks[e[0]];
        });
        var n = Object.keys(r.checks).length;
        if (r.items.every(function (x) { return r.checks[x]; }) || (finish && n)) { r.status = '完了'; r.endedBy = w; r.endedAt = nowLocal(); }
        else if (!n) { r.status = '中断'; r.endedBy = w; r.endedAt = nowLocal(); }
        return cl();
      },
      resetChecklist: function (listId, w) {
        var r = activeRun(listId);
        if (r) { r.status = '中断'; r.endedBy = w; r.endedAt = nowLocal(); }
        return cl();
      },
      finishChecklist: function (listId, w) {
        var r = activeRun(listId);
        if (r) { r.status = '完了'; r.endedBy = w; r.endedAt = nowLocal(); }
        return cl();
      },
      reopenChecklist: function (listId, item, w) {
        var mine = runs.filter(function (r) { return r.listId === listId && r.status !== '実施中' && Object.keys(r.checks).length; });
        var r = mine[mine.length - 1];
        if (r && r.status === '完了' && !activeRun(listId)) {
          if (item) delete r.checks[item];
          if (Object.keys(r.checks).length) { r.status = '実施中'; r.endedBy = ''; r.endedAt = ''; }
          else { r.status = '中断'; r.endedBy = w; r.endedAt = nowLocal(); }
        }
        return cl();
      },
      saveChecklist: function (listId, name, itemsText) {
        var items = itemsText.split('\n');
        if (listId) {
          var L = cls.filter(function (x) { return x.id === listId; })[0];
          L.name = name; L.items = items;
          var r = activeRun(listId);
          if (r) { r.items = items.slice(); r.listName = name; }
        } else {
          cls.push({ id: 'c' + (seq++), name: name, items: items, on: true });
        }
        return cl();
      },
      setChecklistStatus: function (listId, st) {
        cls.forEach(function (x) { if (x.id === listId) x.on = st === '有効'; });
        return cl();
      },
      manualLock: function (pkey, w) {
        manual = { kind: 'lock', at: nowLocal().slice(11, 16), by: w };
        return later({ lock: mockLock() });
      },
      manualUnlock: function (pkey, w) {
        manual = { kind: 'unlock', at: nowLocal().slice(11, 16), by: w };
        return later({ lock: mockLock() });
      },
      saveNote: function (id, text, w) {
        notes[id] = { text: text, by: w, at: nowLocal() };
        return later({ notes: JSON.parse(JSON.stringify(notes)) });
      },
      saveTopicItems: function (id, text, w) {
        var used = {};
        text.split('\n').filter(Boolean).forEach(function (t, i) {
          var x = mitems.filter(function (m) { return !used[m.id] && m.topicId === id && m.st === '未' && m.text === t; })[0];
          if (!x) { x = { id: 'n' + (seq++), topicId: id, text: t, st: '未' }; mitems.push(x); }
          x.order = i + 1;
          used[x.id] = true;
        });
        mitems.forEach(function (m) {
          if (m.topicId === id && m.st === '未' && !used[m.id]) { m.st = '削除'; m.doneBy = w; m.doneAt = nowLocal(); }
        });
        return later({ topics: topicsOut() });
      },
      setTopicItemStatus: function (itemId, st, w) {
        mitems.forEach(function (m) {
          if (m.id !== itemId) return;
          m.st = st;
          m.doneBy = st === '済' ? w : '';
          m.doneAt = st === '済' ? nowLocal() : '';
        });
        return later({ topics: topicsOut() });
      },
      // 部活の予定のサンプル：k1＝画像（予定表の絵）、k2＝PDF（1ページ）
      getClubFile: function (id, knownId) {
        var fileId = id === 'k1' ? 'f1' : 'f2';
        var info = { found: true, id: fileId, updated: T(-14) + ' 20:10', url: 'https://drive.google.com/' };
        if (knownId === fileId) return later(Object.assign(info, { same: true }));
        if (id === 'k1') {
          var cells = '';
          for (var i = 0; i < 35; i++) {
            var x = 30 + (i % 7) * 80, y = 120 + Math.floor(i / 7) * 120;
            cells += '<rect x="' + x + '" y="' + y + '" width="76" height="116" fill="#fff" stroke="#bbb"/>' +
              '<text x="' + (x + 6) + '" y="' + (y + 22) + '" font-size="18" fill="#333">' + (i + 1 <= 31 ? i + 1 : '') + '</text>' +
              (i % 3 === 0 && i < 31 ? '<text x="' + (x + 6) + '" y="' + (y + 60) + '" font-size="15" fill="#2f7d5b">練習</text>' : '');
          }
          var svg = '<svg xmlns="http://www.w3.org/2000/svg" width="620" height="760" viewBox="0 0 620 760">' +
            '<rect width="620" height="760" fill="#f7f3e8"/><text x="310" y="70" font-size="30" text-anchor="middle" fill="#333">（サンプル）部活の予定</text>' + cells + '</svg>';
          return later(Object.assign(info, { name: '2026_10_妹_部活予定（サンプル）.svg', mime: 'image/svg+xml', data: btoa(unescape(encodeURIComponent(svg))) }));
        }
        var pdf = '%PDF-1.4\n1 0 obj<</Type/Catalog/Pages 2 0 R>>endobj\n2 0 obj<</Type/Pages/Kids[3 0 R]/Count 1>>endobj\n' +
          '3 0 obj<</Type/Page/Parent 2 0 R/MediaBox[0 0 420 300]/Contents 4 0 R/Resources<</Font<</F1 5 0 R>>>>>>endobj\n' +
          '4 0 obj<</Length 64>>stream\nBT /F1 30 Tf 70 160 Td (SAMPLE PDF - club plan) Tj ET\nendstream\nendobj\n' +
          '5 0 obj<</Type/Font/Subtype/Type1/BaseFont/Helvetica>>endobj\ntrailer<</Root 1 0 R>>\n%%EOF';
        return later(Object.assign(info, { name: '2026_10_兄_部活予定表（サンプル）.pdf', mime: 'application/pdf', data: btoa(pdf) }));
      },
      // リンク集のサンプル：メモ（.md）3つ（1つは親だけ）とWebページ1つ。親だけのものは、名前が父・母のときだけ出す
      getLinks: function () {
        var parent = isParent();
        return later(JSON.parse(JSON.stringify({
          memos: mockMemos.filter(function (m) { return parent || !m.parentOnly; }).map(function (m) {
            return { id: m.id, name: m.name, title: m.title, updated: m.updated, parentOnly: m.parentOnly };
          }),
          webs: [
            { title: '家族の写真（サンプル）', url: 'https://example.com/', desc: 'あとで pCloud の共有リンクに入れ替える', parentOnly: false },
            { title: '親だけのリンク（サンプル）', url: 'https://example.com/parent', desc: '', parentOnly: true },
          ].filter(function (w) { return parent || !w.parentOnly; }),
        })));
      },
      getMemo: function (pkey, id, knownUpdated) {
        var m = mockMemos.filter(function (x) { return x.id === id && (isParent() || !x.parentOnly); })[0];
        if (!m) return Promise.reject(new Error('メモが見つかりません。リンク集を開き直してください。'));
        var info = { id: m.id, name: m.name, title: m.title, updated: m.updated, parentOnly: m.parentOnly };
        if (knownUpdated && knownUpdated === m.updated) return later(Object.assign(info, { same: true }));
        return later(Object.assign(info, { text: m.text }));
      },
      getCheckHistory: function () {
        return later(JSON.parse(JSON.stringify(runs.filter(function (r) { return Object.keys(r.checks).length; }).slice().reverse())));
      },
      addShopping: function (text, store, w) {
        splitItems(text).forEach(function (n) {
          db.shopping.push({ id: 'm' + (seq++), name: n, store: store, by: w, at: today, st: '未' });
        });
        return later(lists());
      },
      setShoppingStatus: function (id, st, w) { return setStatus('shopping', id, st, w); },
      saveStores: function (text) {
        db.stores = text.split('\n').filter(Boolean);
        return later({ stores: db.stores.slice() });
      },
      addTask: function (text, assignee, due, w) {
        db.tasks.push({ id: 't' + (seq++), text: text, assignee: assignee, due: due, by: w, at: today, st: '未' });
        return later(lists());
      },
      setTaskStatus: function (id, st, w) { return setStatus('tasks', id, st, w); },
    };
  })();

  $('#setupForm').addEventListener('submit', function (e) {
    e.preventDefault();
    var v = $('#setupUrl').value.trim();
    var i = v.indexOf('#');
    if (i === -1 || !/(^|&)api=/.test(v.slice(i + 1))) { toast('「#api=」が入ったURLを貼ってください'); return; }
    location.hash = v.slice(i + 1);
    location.reload();
  });

  // ---------- 開始 ----------
  if (PREVIEW) $('#previewNote').hidden = false;
  if (LIVE) { // 前回のタブの並び（子どものタブを含む）を、読み込みを待たずに出す
    var bootClubs = savedClubs();
    if (bootClubs.length) renderClubs(bootClubs);
  }
  setTab(wantTab);
  if (LIVE || PREVIEW) {
    load(false);
  } else {
    $('#todayLabel').textContent = '';
    $('#setupSheet').hidden = false;
  }
})();
</script>
</body>
</html>
